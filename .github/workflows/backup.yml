name: Cópia do banco

# Plano Free do Supabase não tem cópia automática. Toda semana (domingo, 3h de Brasília) e quando for
# disparada à mão, copia o schema public (pedidos, peças, trocas, clientes...) com pg_dump, cifra com a
# senha BACKUP_SENHA e guarda como artefato do GitHub por 90 dias. Só lê o banco: nada é alterado.
# Segredos (Settings → Secrets and variables → Actions): SUPABASE_DB_URL e BACKUP_SENHA.

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-banco
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir segredos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_SENHA" ]; then
            echo "::error::Faltam os segredos SUPABASE_DB_URL e/ou BACKUP_SENHA (veja docs/PASSO-A-PASSO.md, Cópia do banco)."
            exit 1
          fi
      - name: Instalar pg_dump 17 (mesma versão do banco)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Copiar e cifrar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          set -euo pipefail
          nome="banco-$(date -u +%Y-%m-%d)"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -Fc -f "$nome.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_SENHA" --symmetric --cipher-algo AES256 -o "$nome.dump.gpg" "$nome.dump"
          rm "$nome.dump"
          ls -lh "$nome.dump.gpg"
          echo "ARQUIVO=$nome.dump.gpg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQUIVO }}
          path: ${{ env.ARQUIVO }}
          retention-days: 90
          if-no-files-found: error
