name: Proteções do app

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: falhas-de-tela
          path: |
            playwright-report/
            test-results/
          retention-days: 7
